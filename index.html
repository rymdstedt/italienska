<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Impara l’italiano</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Italienska">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%87%AE%F0%9F%87%B9%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f8f4;
  --surface: #ffffff;
  --ink: #1b2a28;
  --muted: #5b6b68;
  --line: #d5ded9;
  --primary: #0f766e;
  --primary-ink: #ffffff;
  --soft: #e3f1ee;
  --good: #1f7a3d;
  --good-bg: #dff3e4;
  --bad: #b3261e;
  --bad-bg: #fbe3e0;
  --star: #e0a100;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101816; --surface: #19241f; --ink: #eef4f1; --muted: #9bb0aa; --line: #2c3d37;
    --primary: #2bb3a6; --primary-ink: #04201c; --soft: #173430;
    --good: #7fd69a; --good-bg: #17331f; --bad: #ff9a90; --bad-bg: #3a1b18; --star: #f2c94c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101816; --surface: #19241f; --ink: #eef4f1; --muted: #9bb0aa; --line: #2c3d37;
  --primary: #2bb3a6; --primary-ink: #04201c; --soft: #173430;
  --good: #7fd69a; --good-bg: #17331f; --bad: #ff9a90; --bad-bg: #3a1b18; --star: #f2c94c;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 20px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 560px; margin: 0 auto; padding: 20px 18px 240px; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }

.title { font-size: 34px; font-weight: 800; margin: 8px 0 4px; letter-spacing: -0.5px; }
.h2 { font-size: 24px; font-weight: 800; margin: 26px 0 12px; }
.sub { color: var(--muted); margin: 0 0 22px; font-size: 19px; }
.small { font-size: 17px; color: var(--muted); }
.stripe { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 0 0 18px; }
.stripe i { flex: 1; }
.stripe i:nth-child(1) { background: #2e8b57; }
.stripe i:nth-child(2) { background: #f3f1ea; }
.stripe i:nth-child(3) { background: #d0342c; }

.card {
  background: var(--surface); border: 2px solid var(--line); border-radius: 18px;
  padding: 16px 18px; margin: 0 0 14px;
}
.lesson {
  display: flex; align-items: center; gap: 16px; width: 100%; text-align: left;
  background: var(--surface); border: 2px solid var(--line); border-radius: 18px;
  padding: 16px 18px; margin: 0 0 12px; min-height: 84px;
}
.lesson:active { transform: scale(0.985); }
.lesson .em { font-size: 40px; line-height: 1; }
.lesson .tx { flex: 1; min-width: 0; }
.lesson .nm { font-weight: 700; font-size: 22px; display: block; }
.lesson .ct { color: var(--muted); font-size: 17px; display: block; }
.lesson .st { color: var(--star); font-size: 22px; white-space: nowrap; font-weight: 800; }
.lesson.done { border-color: var(--good); }
.lesson.test { border-style: dashed; border-color: var(--primary); }
.mini { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 8px; }
.mini > div { height: 100%; background: var(--primary); }

.top { display: flex; align-items: center; gap: 14px; margin: 4px 0 24px; }
.back { font-size: 18px; color: var(--muted); padding: 10px 6px; min-height: 44px; }
.bar { flex: 1; height: 16px; background: var(--line); border-radius: 8px; overflow: hidden; }
.bar > div { height: 100%; background: var(--primary); border-radius: 8px; transition: width .35s ease; }

.ask { color: var(--muted); font-size: 19px; margin: 0 0 10px; }
.word { display: flex; align-items: center; gap: 14px; margin: 0 0 26px; }
.word .big { font-size: 32px; font-weight: 800; line-height: 1.2; letter-spacing: -0.3px; }
.listen {
  flex: none; width: 56px; height: 56px; border-radius: 50%;
  background: var(--primary); color: var(--primary-ink); font-size: 26px;
  display: grid; place-items: center;
}
.listen.slow { background: var(--soft); color: var(--ink); }
.listen:active { transform: scale(0.94); }
.biglisten { display: flex; gap: 16px; justify-content: center; margin: 10px 0 28px; }
.biglisten .listen { width: 96px; height: 96px; font-size: 44px; }

.opt {
  display: block; width: 100%; text-align: left;
  background: var(--surface); border: 2px solid var(--line); border-radius: 16px;
  padding: 16px 18px; margin: 0 0 12px; min-height: 68px;
  font-size: 22px; font-weight: 600;
}
.opt:active { transform: scale(0.985); }
.opt.good { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.opt.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.opt[disabled] { cursor: default; }

.feedback {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 16px 18px calc(18px + env(safe-area-inset-bottom, 0px));
  border-top: 2px solid var(--line);
}
.feedback.good { background: var(--good-bg); border-color: var(--good); }
.feedback.bad { background: var(--bad-bg); border-color: var(--bad); }
.feedback .in { max-width: 560px; margin: 0 auto; }
.feedback h2 { margin: 0 0 4px; font-size: 24px; }
.feedback.good h2 { color: var(--good); }
.feedback.bad h2 { color: var(--bad); }
.feedback p { margin: 0 0 12px; font-size: 19px; }
.go {
  display: block; width: 100%; background: var(--primary); color: var(--primary-ink);
  font-weight: 800; font-size: 22px; border-radius: 16px; padding: 16px; min-height: 60px; text-align: center;
}
.go:active, .btn2:active { transform: scale(0.985); }
.go[disabled] { opacity: .45; }
.btn2 {
  display: block; width: 100%; background: var(--surface); color: var(--ink);
  border: 2px solid var(--line); font-weight: 700; font-size: 20px; border-radius: 16px;
  padding: 14px; min-height: 56px; margin: 12px 0 0; text-align: center;
}
.btn2.sm { font-size: 17px; min-height: 44px; padding: 10px; color: var(--muted); }
.two { display: flex; gap: 10px; }
.two > * { flex: 1; }

.tip { background: var(--soft); border-radius: 18px; padding: 16px 18px; margin: 0 0 18px; font-size: 18px; }
.tip h3 { margin: 0 0 6px; font-size: 19px; }
.tip b { color: var(--primary); }
.phr { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.phr .listen { width: 44px; height: 44px; font-size: 20px; }
.phr .it { font-weight: 700; display: block; }
.phr .sv { color: var(--muted); font-size: 17px; display: block; }

.ans {
  width: 100%; font: inherit; font-size: 24px; padding: 14px 16px; color: var(--ink);
  background: var(--surface); border: 2px solid var(--line); border-radius: 14px; outline: none;
}
.ans:focus { border-color: var(--primary); }
.accents { display: flex; gap: 8px; margin: 10px 0 18px; flex-wrap: wrap; }
.accents button {
  min-width: 48px; height: 48px; border-radius: 12px; background: var(--surface);
  border: 2px solid var(--line); font-size: 22px; font-weight: 700;
}
.slot {
  min-height: 72px; border-bottom: 2px dashed var(--line); padding: 6px 0 10px; margin: 0 0 22px;
  display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start;
}
.bank { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px; }
.tile {
  background: var(--surface); border: 2px solid var(--line); border-bottom-width: 4px;
  border-radius: 12px; padding: 8px 14px; font-size: 21px; font-weight: 600; min-height: 48px;
}
.tile.gone { visibility: hidden; }

.micwrap { text-align: center; margin: 12px 0 10px; }
.mic {
  width: 128px; height: 128px; border-radius: 50%; margin: 0 auto;
  background: var(--primary); color: var(--primary-ink); font-size: 54px;
  display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.15);
}
.mic.on { background: var(--bad); animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
.mst { min-height: 56px; margin: 14px 0 0; font-size: 19px; color: var(--muted); }
.reveal { font-size: 26px; font-weight: 800; margin: 10px 0; }

.done { text-align: center; padding-top: 30px; }
.done .stars { font-size: 56px; color: var(--star); letter-spacing: 6px; margin: 10px 0; }
.done h1 { font-size: 34px; margin: 6px 0; }
.done .pct { font-size: 48px; font-weight: 800; color: var(--primary); margin: 0; }
.done p { color: var(--muted); margin: 0 0 24px; }
.mistakes { text-align: left; }
.mistakes li { margin: 0 0 10px; }

.seg { display: flex; gap: 8px; margin: 8px 0 4px; }
.seg button { flex: 1; border: 2px solid var(--line); border-radius: 12px; padding: 10px; font-size: 17px; font-weight: 700; background: var(--surface); }
.seg button.on { border-color: var(--primary); background: var(--soft); color: var(--primary); }
textarea { width: 100%; font: inherit; font-size: 14px; padding: 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); min-height: 80px; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
var KEY = "italienska-v2";

/* Kursinnehåll. Varje fras: ["italienska|alternativ", "svenska"]. Första italienska varianten visas; alla godkänns. */
var LEVELS = [
{ id: "n1", name: "Första stegen", cefr: "A1", lessons: [
  { id: "halsningar", em: "👋", name: "Hälsningar",
    tip: "Bland vänner säger man <b>ciao</b>. Till andra säger man <b>buongiorno</b> (fram till eftermiddagen) eller <b>buonasera</b> (från eftermiddagen). Bokstaven <b>c</b> uttalas ”tj” före e och i: <i>ciao</i> = ”tjao”. <b>gn</b> uttalas som ”nj”: <i>buongiorno</i> = ”bon-djorno”.",
    items: [
      ["Ciao", "Hej"],
      ["Buongiorno", "God morgon / god dag"],
      ["Buonasera", "God kväll"],
      ["Buonanotte", "God natt"],
      ["Arrivederci", "Adjö"],
      ["A presto", "Vi ses snart"],
      ["Grazie", "Tack"],
      ["Grazie mille", "Tack så mycket"],
      ["Prego", "Varsågod"],
      ["Per favore", "Snälla (vid en begäran)"],
      ["Scusi", "Ursäkta (artigt)"],
      ["Sì", "Ja"],
      ["No", "Nej"],
      ["Come sta?", "Hur mår ni? (artigt)"],
      ["Bene, grazie", "Bra, tack"]
  ]},
  { id: "presentera", em: "🙋", name: "Presentera dig",
    tip: "Verbet <b>essere</b> (att vara): io <b>sono</b>, tu <b>sei</b>, lui/lei <b>è</b>, noi <b>siamo</b>, voi <b>siete</b>, loro <b>sono</b>. Ordet för ”jag” utelämnas oftast: <i>Sono svedese</i> = Jag är svensk. Adjektiv på -o får -a när de gäller en kvinna: <i>italiano → italiana</i>.",
    items: [
      ["Mi chiamo Anna", "Jag heter Anna"],
      ["Come ti chiami?", "Vad heter du?"],
      ["Piacere", "Trevligt att träffas"],
      ["Sono svedese", "Jag är svensk"],
      ["Sono di Stoccolma", "Jag är från Stockholm"],
      ["Di dove sei?", "Var kommer du ifrån?"],
      ["Lui è italiano", "Han är italienare"],
      ["Lei è italiana", "Hon är italienska"],
      ["Siamo amici", "Vi är vänner"],
      ["Sei sposata?", "Är du gift? (till en kvinna)"],
      ["Sono in pensione", "Jag är pensionär"],
      ["Abito in Svezia", "Jag bor i Sverige"],
      ["Parlo un po' di italiano", "Jag pratar lite italienska"],
      ["Questo è mio marito", "Det här är min man"]
  ]},
  { id: "siffror", em: "🔢", name: "Siffror och ålder",
    tip: "1–10: uno, due, tre, quattro, cinque, sei, sette, otto, nove, dieci. Sedan undici (11), dodici (12) … venti (20). Ålder säger man med <b>avere</b> (att ha): <i>Ho sessant'anni</i> = ”jag har sextio år”. Avere: <b>ho, hai, ha, abbiamo, avete, hanno</b>. H uttalas aldrig på italienska.",
    items: [
      ["Uno, due, tre", "Ett, två, tre"],
      ["Quattro, cinque, sei", "Fyra, fem, sex"],
      ["Sette, otto, nove, dieci", "Sju, åtta, nio, tio"],
      ["Undici, dodici, tredici", "Elva, tolv, tretton"],
      ["Quindici", "Femton"],
      ["Venti", "Tjugo"],
      ["Trenta, quaranta, cinquanta", "Trettio, fyrtio, femtio"],
      ["Sessanta, settanta", "Sextio, sjuttio"],
      ["Cento", "Hundra"],
      ["Quanti anni hai?", "Hur gammal är du?"],
      ["Ho sessantacinque anni", "Jag är sextiofem år"],
      ["Ho due figli", "Jag har två barn"],
      ["Mia figlia ha trent'anni", "Min dotter är trettio år"]
  ]},
  { id: "mat", em: "🍝", name: "Mat och dryck",
    tip: "Substantiv är maskulina eller feminina. Bestämd artikel: <b>il</b> (maskulin), <b>la</b> (feminin), <b>l'</b> före vokal, <b>lo</b> före s+konsonant och z. Obestämd: <b>un</b>, <b>una</b>, <b>un'</b>, <b>uno</b>. Ord på -o är oftast maskulina, ord på -a oftast feminina.",
    items: [
      ["Il pane", "Brödet"],
      ["La pizza", "Pizzan"],
      ["Il vino rosso", "Rödvinet"],
      ["Un caffè, per favore", "En kaffe, tack"],
      ["Un bicchiere d'acqua", "Ett glas vatten"],
      ["Una birra", "En öl"],
      ["Lo zucchero", "Sockret"],
      ["Il formaggio", "Osten"],
      ["La mela", "Äpplet"],
      ["Il pesce e la carne", "Fisken och köttet"],
      ["Un gelato al cioccolato", "En chokladglass"],
      ["Mi piace il gelato", "Jag tycker om glass"],
      ["Acqua naturale o frizzante?", "Vatten utan eller med kolsyra?"],
      ["Ho fame", "Jag är hungrig"],
      ["Ho sete", "Jag är törstig"]
  ]},
  { id: "familj", em: "👨‍👩‍👧", name: "Familjen",
    tip: "Possessiva pronomen: <b>mio/mia</b> (min), <b>tuo/tua</b> (din), <b>suo/sua</b> (hans/hennes). Med släktord i singular används ingen artikel: <i>mia madre</i>. Men i plural: <i>i miei figli</i> (mina barn).",
    items: [
      ["Mia madre", "Min mamma"],
      ["Mio padre", "Min pappa"],
      ["Mio figlio", "Min son"],
      ["Mia figlia", "Min dotter"],
      ["Mio fratello", "Min bror"],
      ["Mia sorella", "Min syster"],
      ["Mio marito", "Min man"],
      ["Mia moglie", "Min fru"],
      ["I miei figli", "Mina barn"],
      ["I miei nipoti", "Mina barnbarn"],
      ["La nonna", "Mormor / farmor"],
      ["Il nonno", "Morfar / farfar"],
      ["Tua sorella è simpatica", "Din syster är trevlig"],
      ["Ho un fratello e due sorelle", "Jag har en bror och två systrar"],
      ["Come si chiama tuo figlio?", "Vad heter din son?"]
  ]},
  { id: "adjektiv", em: "🎨", name: "Färger och adjektiv",
    tip: "Adjektiv står oftast <i>efter</i> substantivet och böjs efter det: <i>la macchina rossa</i>, <i>il gatto nero</i>. Adjektiv på -e är lika i båda genus: <i>grande, verde</i>. Plural: -o → <b>-i</b>, -a → <b>-e</b>, -e → <b>-i</b>.",
    items: [
      ["Rosso, bianco, verde", "Röd, vit, grön"],
      ["Giallo, blu, nero", "Gul, blå, svart"],
      ["La casa è grande", "Huset är stort"],
      ["La macchina rossa", "Den röda bilen"],
      ["Il gatto nero", "Den svarta katten"],
      ["Il cane è piccolo", "Hunden är liten"],
      ["Una bella giornata", "En vacker dag"],
      ["Il mare è blu", "Havet är blått"],
      ["Sono stanca|Sono stanco", "Jag är trött"],
      ["Sono contenta|Sono contento", "Jag är glad"],
      ["La pizza è buona", "Pizzan är god"],
      ["Il caffè è caldo", "Kaffet är varmt"],
      ["L'acqua è fredda", "Vattnet är kallt"],
      ["Un vestito nuovo", "En ny klänning"]
  ]},
  { id: "plural", em: "🍎", name: "Plural",
    tip: "Plural: -o → <b>-i</b> (libro → libri), -a → <b>-e</b> (casa → case), -e → <b>-i</b> (fiore → fiori). Artiklar i plural: <b>i</b> (maskulin), <b>gli</b> (maskulin före vokal, s+konsonant och z) och <b>le</b> (feminin). Ord som slutar på betonad vokal ändras inte: <i>il caffè → i caffè</i>.",
    items: [
      ["Il libro, i libri", "Boken, böckerna"],
      ["La casa, le case", "Huset, husen"],
      ["Il fiore, i fiori", "Blomman, blommorna"],
      ["L'amico, gli amici", "Vännen, vännerna"],
      ["L'amica, le amiche", "Väninnan, väninnorna"],
      ["Lo studente, gli studenti", "Studenten, studenterna"],
      ["Due caffè", "Två kaffe"],
      ["Tre pizze", "Tre pizzor"],
      ["Le mele sono rosse", "Äpplena är röda"],
      ["I bambini sono stanchi", "Barnen är trötta"],
      ["Gli occhi azzurri", "De blå ögonen"],
      ["Le città italiane", "De italienska städerna"],
      ["Ci sono molti turisti", "Det finns många turister"]
  ]},
  { id: "restaurang", em: "🍽️", name: "På restaurangen",
    tip: "<b>Vorrei</b> (jag skulle vilja) är det artigaste sättet att beställa. <b>Prendo</b> = jag tar. Notan heter <b>il conto</b>. På många restauranger betalar man <i>il coperto</i> (kuvertavgift). Dricks är inte obligatoriskt.",
    items: [
      ["Un tavolo per due, per favore", "Ett bord för två, tack"],
      ["Vorrei un caffè", "Jag skulle vilja ha en kaffe"],
      ["Prendo la pasta", "Jag tar pastan"],
      ["Cosa mi consiglia?", "Vad rekommenderar ni?"],
      ["Il menù, per favore", "Menyn, tack"],
      ["Sono vegetariana|Sono vegetariano", "Jag är vegetarian"],
      ["Senza glutine", "Utan gluten"],
      ["Un bicchiere di vino bianco", "Ett glas vitt vin"],
      ["Il conto, per favore", "Notan, tack"],
      ["Posso pagare con la carta?", "Kan jag betala med kort?"],
      ["Era tutto buonissimo", "Allt var jättegott"],
      ["Avete un tavolo libero?", "Har ni ett ledigt bord?"],
      ["Che cosa prendete?", "Vad tar ni? (till flera)"],
      ["Da bere?", "Något att dricka?"]
  ]}
]},
{ id: "n2", name: "Vardagen", cefr: "A1–A2", lessons: [
  { id: "verb_are", em: "🗣️", name: "Verb på -are",
    tip: "Regelbundna verb på <b>-are</b>, t.ex. <i>parlare</i> (prata): parl<b>o</b>, parl<b>i</b>, parl<b>a</b>, parl<b>iamo</b>, parl<b>ate</b>, parl<b>ano</b>. Likadant: abitare (bo), lavorare (arbeta), mangiare (äta), studiare (studera), cucinare (laga mat), comprare (köpa).",
    items: [
      ["Parlo italiano", "Jag pratar italienska"],
      ["Parli svedese?", "Pratar du svenska?"],
      ["Lei parla inglese", "Hon pratar engelska"],
      ["Abitiamo a Roma", "Vi bor i Rom"],
      ["Dove abitate?", "Var bor ni?"],
      ["Lavoro in un ufficio", "Jag arbetar på ett kontor"],
      ["Mangiamo alle otto", "Vi äter klockan åtta"],
      ["I bambini giocano in giardino", "Barnen leker i trädgården"],
      ["Studio l'italiano ogni giorno", "Jag studerar italienska varje dag"],
      ["Mio marito cucina molto bene", "Min man lagar mat mycket bra"],
      ["Ascolto la musica", "Jag lyssnar på musik"],
      ["Aspetti l'autobus?", "Väntar du på bussen?"],
      ["Compro il pane", "Jag köper bröd"]
  ]},
  { id: "verb_ere_ire", em: "📖", name: "Verb på -ere och -ire",

function shuffle(a) {

}

/* Tal till italienska ord, så att ”3” och ”tre” räknas lika. */
var U = ["zero","uno","due","tre","quattro","cinque","sei","sette","otto","nove","dieci","undici","dodici","tredici","quattordici","quindici","sedici","diciassette","diciotto","diciannove"];
var T = ["","","venti","trenta","quaranta","cinquanta","sessanta","settanta","ottanta","novanta"];
function num(n) {
  if (n < 20) return U[n];
  if (n < 100) {
    var t = T[Math.floor(n / 10)], u = n % 10;
    if (u === 1 || u === 8) t = t.slice(0, -1);
    return t + (u ? U[u] : "");
  }
  if (n < 1000) {
    var c = Math.floor(n / 100), r = n % 100;
    var h = c === 1 ? "cento" : U[c] + "cento";
    if (r >= 80 && r < 90) h = h.slice(0, -1);
    return h + (r ? num(r) : "");
  }
  if (n < 1000000) {
    var k = Math.floor(n / 1000), r2 = n % 1000;
    return (k === 1 ? "mille" : num(k) + "mila") + (r2 ? num(r2) : "");
  }
  return String(n);
}

function norm(s) {
  s = String(s).toLowerCase().replace(/[’‘`´]/g, "'");
  s = s.replace(/\b(\d{1,2})[:.](\d{2})\b/g, function (_, h, m) {
    m = parseInt(m, 10);
    return h + (m === 30 ? " e mezza" : m === 15 ? " e un quarto" : m === 0 ? "" : " e " + m);
  });
  s = s.replace(/\d+/g, function (d) { return " " + num(parseInt(d, 10)) + " "; });
  s = s.replace(/[.,!?;:¡¿"“”«»()\[\]…—–\-]/g, " ").replace(/'/g, " ");
  s = s.replace(/\s+/g, " ").trim();
  s = s.replace(/^(io|tu|lui|lei|noi|voi|loro) /, "");
  s = s.replace(/\bche cosa\b/g, "cosa");
  return s;
}
function flat(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function lev(a, b) {
  var m = a.length, n = b.length, prev = [], cur, i, j;
  if (!m) return n; if (!n) return m;
  for (j = 0; j <= n; j++) prev[j] = j;
  for (i = 1; i <= m; i++) {
    cur = [i];
    for (j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}

/* Rättning av skrivet svar. */
function checkTyped(ans, alts) {
  var a = norm(ans), fa = flat(a), i;
  if (!a) return { ok: false };
  for (i = 0; i < alts.length; i++) if (a === norm(alts[i])) return { ok: true, kind: "exact", alt: alts[i] };
  for (i = 0; i < alts.length; i++) if (fa === flat(norm(alts[i]))) return { ok: true, kind: "accent", alt: alts[i] };
  for (i = 0; i < alts.length; i++) {
    var ft = flat(norm(alts[i]));
    var allow = ft.length >= 25 ? 2 : ft.length >= 8 ? 1 : 0;
    if (lev(fa, ft) <= allow) return { ok: true, kind: "typo", alt: alts[i] };
  }
  return { ok: false };
}

/* Rättning av talat svar: likhet mellan 0 och 1. */
function speechScore(heard, alts) {
  var best = 0;
  heard.forEach(function (h) {
    var a = flat(norm(h)), wa = a.split(" ");
    alts.forEach(function (t) {
      var b = flat(norm(t)), wb = b.split(" ");
      var cs = 1 - lev(a, b) / Math.max(a.length, b.length, 1);
      var ws = 1 - lev(wa, wb) / Math.max(wa.length, wb.length, 1);
      best = Math.max(best, cs, ws);
    });
  });
  return best;
}

    for (var i = 0; i < vs.length; i++) {
      var lang = (vs[i].lang || "").replace("_", "-").toLowerCase();

        if (!first) first = vs[i];
        if (lang === "it-it" && /enhanced|premium|alice|federica|luca|paola/i.test(vs[i].name)) { itVoice = vs[i]; return; }

    }

  } catch (e) {}
}

/* Inspelade fraser (rösten ”Serena”) ligger i audio/<nyckel>.m4a. Nyckeln är en FNV-1a-hash av texten. */
function audioKey(t) {
  var h = 0x811c9dc5;
  for (var i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return ("0000000" + h.toString(16)).slice(-8);
}

function stopAudio() {
  if (player) { try { player.pause(); } catch (e) {} }
  try { window.speechSynthesis.cancel(); } catch (e) {}
}

  stopAudio();
  if (!player || store.set.device) return ttsSpeak(text, slow);
  var fellBack = false, src = "audio/" + audioKey(String(text)) + ".m4a";
  function fallback() { if (!fellBack && player.getAttribute("src") === src) { fellBack = true; ttsSpeak(text, slow); } }
  try {
    player.onerror = fallback;
    player.setAttribute("src", src);
    player.playbackRate = slow ? 0.7 : (store.set.slow ? 0.85 : 1);
    var p = player.play();
    if (p && p.catch) p.catch(function (err) { if (err && err.name !== "AbortError" && err.name !== "NotAllowedError") fallback(); });
  } catch (e) { fallback(); }
}
function ttsSpeak(text, slow) {
  try {
    var s = window.speechSynthesis;
    if (!s) return;
    s.cancel();
    var u = new SpeechSynthesisUtterance(String(text).replace(/[…—]/g, ", "));
    u.lang = "it-IT";
    u.rate = slow ? 0.55 : (store.set.slow ? 0.7 : 0.9);

function listen(onLive, onDone) {

  var r, heard = [], err = null, finished = false, timer;
  try {
    r = new SR();
    r.lang = "it-IT"; r.interimResults = true; r.maxAlternatives = 5; r.continuous = false;
  } catch (e) { onDone([], "start"); return; }
  rec = r;
  r.onresult = function (e) {
    var prefix = "";
    for (var i = 0; i < e.results.length - 1; i++) prefix += e.results[i][0].transcript + " ";
    var last = e.results[e.results.length - 1];
    heard = [];
    for (var j = 0; j < last.length; j++) heard.push(prefix + last[j].transcript);
    if (onLive && heard[0]) onLive(heard[0]);
  };
  r.onerror = function (e) { err = e.error || "fel"; };
  r.onend = function () {
    clearTimeout(timer);
    if (finished || rec !== r) return;
    finished = true; rec = null;
    onDone(heard, err);
  };
  timer = setTimeout(function () { try { r.stop(); } catch (e) {} }, 12000);
  try { r.start(); } catch (e) { finished = true; rec = null; clearTimeout(timer); onDone([], "start"); }
}

  sum += store.t[lv.id] || 0; n += 1;
  return Math.floor(sum / n);
}
function totalPct() {
  var sum = 0, n = 0;
  LEVELS.forEach(function (lv) {
    lv.lessons.forEach(function (l) { sum += (store.w[l.id] || 0) + (store.o[l.id] || 0); n += 2; });
    sum += store.t[lv.id] || 0; n += 1;
  });
  sum += store.t.final || 0; n += 1;
  return Math.floor(sum / n);
}
/* Nästa steg: första ogjorda delen, annars första som inte är 100 %. */
function nextUp() {
  var i, j, lv, l;
  for (i = 0; i < LEVELS.length; i++) {
    lv = LEVELS[i];
    for (j = 0; j < lv.lessons.length; j++) {
      l = lv.lessons[j];
      if (store.w[l.id] == null || store.o[l.id] == null) return { lesson: l };
    }
    if (store.t[lv.id] == null) return { level: lv };
  }
  if (store.t.final == null) return { final: true };
  for (i = 0; i < LEVELS.length; i++) {
    lv = LEVELS[i];
    for (j = 0; j < lv.lessons.length; j++) {
      l = lv.lessons[j];
      if (store.w[l.id] < 100 || store.o[l.id] < 100) return { lesson: l };
    }
    if (store.t[lv.id] < 100) return { level: lv };
  }
  if (store.t.final < 100) return { final: true };
  return null;
}

/* ---------- Övningar ---------- */
function tileWords(s) {
  return s.split(/\s+/).map(function (w) {
    return w.replace(/^[¡¿"“«(—–\-]+|[.,!?;:"”»)…—–]+$/g, "");
  }).filter(function (w) { return w && /[A-Za-zÀ-ÿ0-9]/.test(w); });
}
function mk(type, item, pool) { return { type: type, item: item, pool: pool, first: true }; }

function buildPractice(l, kind) {
  var lv = l.level.n, a = [], b = [];
  shuffle(l.items).forEach(function (item) {
    if (kind === "w") {
      a.push(mk(Math.random() < 0.5 ? "mc_it" : "mc_sv", item, l.items));
      var canTile = tileWords(item.it[0]).length >= 3;
      var pType = Math.min(0.85, 0.2 + lv * 0.12);
      b.push(mk(canTile && Math.random() > pType ? "tiles" : "type", item, l.items));
    } else {
      a.push(mk(lv >= 2 && Math.random() < 0.25 + lv * 0.08 ? "dict" : "listen", item, l.items));
      var pTr = Math.min(0.85, 0.15 + lv * 0.12);
      b.push(mk(Math.random() < pTr ? "say_tr" : "say_rep", item, l.items));
    }
  });
  return shuffle(a).concat(shuffle(b));
}
function buildTest(items, nType, nDict, nSay) {
  var pick = shuffle(items), q = [], i = 0;
  for (var k = 0; k < nType; k++) q.push(mk("type", pick[i++], items));
  for (k = 0; k < nDict; k++) q.push(mk("dict", pick[i++], items));
  for (k = 0; k < nSay; k++) q.push(mk("say_tr", pick[i++], items));
  return q;
}

function startPractice(kind, id) {
  var l = LESSON[id];
  var queue = buildPractice(l, kind);
  session = { kind: kind, id: id, test: false, title: l.name, queue: queue, total: queue.length, answered: 0, right: 0, wrong: [] };
  renderQ();
}
function startTest(id) {
  var queue, title;
  if (id === "final") { queue = buildTest(ALL_ITEMS, 14, 8, 8); title = "Stora slutprovet"; }
  else { queue = buildTest(LEVEL[id].items, 10, 5, 5); title = "Nivåprov " + LEVEL[id].n; }
  session = { kind: "t", id: id, test: true, title: title, queue: queue, total: queue.length, answered: 0, right: 0, wrong: [] };
  renderQ();
}
function leaveSession() {
  var s = session;
  if (!s) return renderHome();
  if (s.answered > 0 && s.queue.length && !confirm("Vill du avbryta? Resultatet sparas inte.")) return;
  if (s.kind === "t") return s.id === "final" ? renderHome() : renderLevel(s.id);
  renderLesson(s.id);
}

function topBar() {
  var s = session, p = Math.round(s.answered / s.total * 100);
  return '<div class="top"><button class="back" data-act="leave">✕</button>' +
    '<div class="bar" role="progressbar" aria-valuenow="' + p + '" aria-valuemin="0" aria-valuemax="100"><div style="width:' + p + '%"></div></div>' +
    '<span class="small">' + (s.test ? "Prov" : s.kind === "w" ? "✍️" : "🗣️") + '</span></div>';
}
function opts(q, field) {
  var me = field === "sv" ? q.item.sv : q.item.it[0], seen = {}, out = [];
  seen[me] = 1;
  shuffle(q.pool).forEach(function (x) {
    var t = field === "sv" ? x.sv : x.it[0];
    if (out.length < 3 && !seen[t]) { seen[t] = 1; out.push(x); }
  });
  out.push(q.item);
  return shuffle(out);
}
var ACCENTS = ["à", "è", "é", "ì", "ò", "ù"];
function inputHtml() {
  var h = '<input id="ans" class="ans" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" lang="it" enterkeyhint="done" placeholder="Skriv på italienska">' +

  return h + '</div><button class="go" data-act="check">Kontrollera</button>' +
    '<button class="btn2 sm" data-act="dunno">Jag vet inte</button>';
}

function renderQ() {
  var s = session, q = s.queue[0], it = q.item.it[0], h = topBar();
  s.locked = false; s.tries = 0;
  if (q.type === "mc_it" || q.type === "mc_sv" || q.type === "listen") {
    var field = q.type === "mc_sv" ? "it" : "sv";
    s.opts = opts(q, field);
    if (q.type === "mc_it") {
      h += '<p class="ask">Vad betyder det här?</p><div class="word"><button class="listen" data-act="hear" aria-label="Lyssna">🔊</button><span class="big">' + pretty(it) + '</span></div>';
    } else if (q.type === "mc_sv") {
      h += '<p class="ask">Hur säger man det här på italienska?</p><div class="word"><span class="big">' + esc(q.item.sv) + '</span></div>';
    } else {
      h += '<p class="ask">🎧 Lyssna. Vad betyder det?</p>' + listenBtns();
    }
    s.opts.forEach(function (o, i) {
      h += '<button class="opt" data-act="answer" data-i="' + i + '">' + (field === "sv" ? esc(o.sv) : pretty(o.it[0])) + '</button>';
    });
  } else if (q.type === "tiles") {
    var words = tileWords(it), target = {}, extra = [];
    words.forEach(function (w) { target[w.toLowerCase()] = 1; });
    shuffle(q.pool).forEach(function (x) {
      if (x === q.item || extra.length >= 2) return;
      var cand = shuffle(tileWords(x.it[0])).filter(function (w) { return !target[w.toLowerCase()]; })[0];
      if (cand) { target[cand.toLowerCase()] = 1; extra.push(cand); }
    });
    s.bank = shuffle(words.concat(extra)).map(function (w) { return { w: w, used: false }; });
    s.picked = [];
    h += '<p class="ask">Bygg meningen på italienska</p><div class="word"><span class="big">' + esc(q.item.sv) + '</span></div>' +
      '<div id="tiles"></div><button class="go" data-act="checktiles">Kontrollera</button>';
  } else if (q.type === "type") {
    h += '<p class="ask">Skriv på italienska</p><div class="word"><span class="big">' + esc(q.item.sv) + '</span></div>' + inputHtml();
  } else if (q.type === "dict") {
    h += '<p class="ask">🎧 Lyssna och skriv det du hör</p>' + listenBtns() + inputHtml();
  } else if (q.type === "say_rep") {
    h += '<p class="ask">🗣️ Lyssna och säg efter</p><div class="word"><button class="listen" data-act="hear" aria-label="Lyssna">🔊</button><span class="big">' + pretty(it) + '</span></div>' + micHtml();
  } else if (q.type === "say_tr") {
    h += '<p class="ask">🗣️ Säg det här på italienska</p><div class="word"><span class="big">' + esc(q.item.sv) + '</span></div>' + micHtml();
  }
  h += '<div id="fb"></div>';
  show(h);
  if (q.type === "tiles") drawTiles();
  if (q.type === "mc_it" || q.type === "listen" || q.type === "dict" || q.type === "say_rep") speak(it);
  if (q.type === "type" || q.type === "dict") {
    var inp = document.getElementById("ans");
    if (inp && window.matchMedia && window.matchMedia("(pointer: fine)").matches) inp.focus();
  }
}
function listenBtns() {
  return '<div class="biglisten"><button class="listen" data-act="hear" aria-label="Lyssna">🔊</button>' +
    '<button class="listen slow" data-act="hearslow" aria-label="Lyssna långsamt">🐢</button></div>';

function drawTiles() {
  var s = session, h = '<div class="slot" aria-label="Ditt svar">';

  h += '</div><div class="bank">';

  document.getElementById("tiles").innerHTML = h + '</div>';
}

function grade(ok, title, body) {
  var s = session, q = s.queue[0];
  if (s.locked) return;
  s.locked = true;
  stopListening();
  if (q.first) { s.answered++; if (ok) s.right++; else s.wrong.push(q.item); }
  if (!ok && !s.test) { var again = mk(q.type, q.item, q.pool); again.first = false; s.queue.push(again); }
  var btns = app.querySelectorAll("button:not(.listen)");
  for (var k = 0; k < btns.length; k++) if (!btns[k].classList.contains("back")) btns[k].disabled = true;
  var inp = document.getElementById("ans");
  if (inp) { inp.disabled = true; inp.blur(); }
  if (q.type !== "say_rep" && q.type !== "say_tr") speak(q.item.it[0]);
  document.getElementById("fb").innerHTML = '<div class="feedback ' + (ok ? "good" : "bad") + '"><div class="in">' +
    '<h2>' + (title || (ok ? "Rätt! 👏" : "Inte riktigt")) + '</h2>' +
    '<p>' + body + '</p>' +
    '<div class="two"><button class="listen" data-act="hear" aria-label="Lyssna" style="flex:none">🔊</button>' +
    '<button class="go" data-act="next">Fortsätt</button></div></div></div>';
  var b = app.querySelector(".bar > div");
  if (b) b.style.width = Math.round(s.answered / s.total * 100) + "%";
}
function answerLine(item) { return "<b>" + pretty(item.it[0]) + "</b> = " + esc(item.sv); }

function onAnswer(i) {
  var s = session, q = s.queue[0];
  if (s.locked) return;
  var chosen = s.opts[i], ok = chosen === q.item;
  var btns = app.querySelectorAll(".opt");
  btns[s.opts.indexOf(q.item)].classList.add("good");
  if (!ok) btns[i].classList.add("bad");
  grade(ok, null, answerLine(q.item));
}
function onCheckTyped(giveUp) {
  var s = session, q = s.queue[0];
  if (s.locked) return;
  var inp = document.getElementById("ans"), val = inp ? inp.value : "";
  if (!giveUp && !val.trim()) { if (inp) inp.focus(); return; }
  var r = giveUp ? { ok: false } : checkTyped(val, q.item.it);
  var main = "<b>" + pretty(r.alt || q.item.it[0]) + "</b>";
  if (r.ok && r.kind === "exact") grade(true, null, main + " = " + esc(q.item.sv));
  else if (r.ok && r.kind === "accent") grade(true, "Rätt! Tänk på accenterna", main);
  else if (r.ok) grade(true, "Nästan rätt – litet stavfel", "Rätt stavning: " + main);
  else grade(false, null, "Rätt svar: " + main + (val.trim() ? "<br>Du skrev: " + pretty(val) : ""));
}
function onCheckTiles() {
  var s = session, q = s.queue[0];
  if (s.locked || !s.picked.length) return;
  var val = s.picked.map(function (bi) { return s.bank[bi].w; }).join(" ");
  var r = checkTyped(val, q.item.it);
  if (r.ok) grade(true, null, answerLine(q.item));
  else grade(false, null, "Rätt svar: <b>" + pretty(q.item.it[0]) + "</b>");
}

function onMic() {
  var s = session, q = s.queue[0];
  if (s.locked) return;
  var btn = app.querySelector(".mic"), st = document.getElementById("mst");
  if (rec) { try { rec.stop(); } catch (e) {} return; }
  btn.classList.add("on"); btn.textContent = "■";
  st.textContent = "Jag lyssnar … prata nu";
  listen(function (live) {
    st.textContent = "”" + live + "”";
  }, function (heard, err) {
    if (session !== s || s.locked) return;
    btn.classList.remove("on"); btn.textContent = "🎤";
    if (err === "not-allowed" || err === "service-not-allowed" || err === "start") {
      micBlocked = true;
      document.getElementById("micarea").outerHTML = '<p class="mst">⚠️ Mikrofonen gick inte att använda. ' +
        'Tillåt mikrofonen för den här sidan (på iPhone/iPad: Inställningar → Allmänt → Tangentbord → Diktering ska vara på). Under tiden rättar du själv.</p>' + micHtml();
      return;
    }
    if (!heard.length) {
      st.textContent = err === "network" ? "Ingen internetanslutning – försök igen." : "Jag hörde inget. Tryck och försök igen.";
      return;
    }
    var said = esc(heard[0]);
    if (speechScore(heard, q.item.it) >= 0.8) {
      grade(true, "Bra uttal! 👏", "Jag hörde: ”" + said + "”<br>" + answerLine(q.item));
      speak(q.item.it[0]);
      return;
    }
    s.tries++;
    if (s.tries < 2) {
      st.innerHTML = "Jag hörde: ”" + said + "”<br><b>Försök igen!</b>";
      if (q.type === "say_rep") speak(q.item.it[0]);
    } else {
      grade(false, null, "Jag hörde: ”" + said + "”<br>Rätt: " + answerLine(q.item));
      speak(q.item.it[0]);
    }
  });
}
function onReveal() {

function next() {

function renderDone() {
  var s = session, p = Math.round(s.right / s.total * 100);
  var map = s.kind === "t" ? store.t : store[s.kind];
  var prev = map[s.id], best = prev == null || p > prev;
  if (best) { map[s.id] = p; saveStore(); }
  var msg = p === 100 ? "Perfetto! Helt rätt!" : p >= 80 ? "Bra jobbat!" : "Bra kämpat! Öva igen så sitter det.";
  var h = '<div class="done"><div class="stars" aria-label="' + p + ' procent">' + stars(p) + '</div>' +
    '<p class="pct">' + p + ' %</p><h1>' + msg + '</h1>' +
    '<p>' + esc(s.title) + (s.test ? "" : s.kind === "w" ? " – skriftligt" : " – muntligt") + '. ' +
    (best && prev != null ? "Nytt rekord! " : "") + (!best ? "Ditt bästa: " + prev + " %. " : "") + '</p>';
  if (s.wrong.length) {
    h += '<div class="card mistakes"><b>Öva extra på:</b><ul>';
    var seen = [];
    s.wrong.forEach(function (it) { if (seen.indexOf(it) < 0) { seen.push(it); h += '<li>' + answerLine(it) + '</li>'; } });
    h += '</ul></div>';
  }
  var back = s.kind === "t" ? (s.id === "final" ? 'data-act="home"' : 'data-act="level" data-id="' + s.id + '"') : 'data-act="lesson" data-id="' + s.id + '"';
  var again = s.kind === "t" ? 'data-act="test" data-id="' + s.id + '"' : 'data-act="practice" data-kind="' + s.kind + '" data-id="' + s.id + '"';
  h += '<button class="go" ' + back + '>Tillbaka</button><button class="btn2" ' + again + '>Gör om</button>';
  if (s.kind === "w" && store.o[s.id] == null) h += '<button class="btn2" data-act="practice" data-kind="o" data-id="' + s.id + '">🗣️ Till muntlig övning</button>';
  h += '</div>';
  session = null;
  show(h);
}

/* ---------- Inställningar ---------- */
function backupCode() {
  return btoa(unescape(encodeURIComponent(JSON.stringify(store))));
}
function renderSettings() {
  session = null; view = { name: "settings" };
  var micOk = !!SR;
  var h = '<div class="top"><button class="back" data-act="home">‹ Tillbaka</button></div>' +
    '<h1 class="title">Inställningar</h1>' +
    '<div class="card"><b>🔊 Uppläsning</b><div class="seg">' +
    '<button class="' + (!store.set.device ? "on" : "") + '" data-act="setdevice" data-v="0">Inspelad röst</button>' +
    '<button class="' + (store.set.device ? "on" : "") + '" data-act="setdevice" data-v="1">Enhetens röst</button></div>' +
    '<div class="seg">' +
    '<button class="' + (!store.set.slow ? "on" : "") + '" data-act="setslow" data-v="0">Normal takt</button>' +
    '<button class="' + (store.set.slow ? "on" : "") + '" data-act="setslow" data-v="1">Långsammare</button></div>' +
    '<button class="btn2" data-act="testvoice">Testa rösten</button>' +
    '<p class="small" id="voicest">' + (!store.set.device ? "Alla fraser är inlästa med den italienska rösten Serena, så det låter likadant på alla enheter. Hörs inget? Kontrollera att ljudet är på och att telefonen inte står på ljudlöst."
      : itVoice ? "Enhetens italienska röst: " + esc(itVoice.name) : "Hittar ingen italiensk röst på enheten. På iPhone/iPad: Inställningar → Hjälpmedel → Uppläst innehåll → Röster → Italienska.") + '</p></div>' +
    '<div class="card"><b>🎤 Muntliga övningar</b>' +
    (micOk ? '<div class="seg"><button class="' + (!store.set.self ? "on" : "") + '" data-act="setself" data-v="0">Mikrofonen rättar</button>' +
      '<button class="' + (store.set.self ? "on" : "") + '" data-act="setself" data-v="1">Jag rättar själv</button></div>' +
      '<button class="btn2" data-act="testmic">Testa mikrofonen – säg ”Buongiorno”</button><p class="small" id="micst"></p>'
      : '<p class="small">Den här webbläsaren kan inte lyssna på tal, så du rättar själv i de muntliga övningarna. Safari på iPhone/iPad och Chrome på dator brukar fungera.</p>') +
    '<p class="small">Om mikrofonen inte fungerar på iPhone/iPad: Inställningar → Allmänt → Tangentbord → slå på <i>Diktering</i>, och tillåt mikrofonen när Safari frågar.</p></div>' +
    '<div class="card"><b>📱 Lägg appen på hemskärmen</b><p class="small">I Safari: tryck på dela-knappen ⬆️ och välj <i>Lägg till på hemskärmen</i>. Då öppnas kursen som en app och dina resultat sparas säkrare.</p></div>' +
    '<div class="card"><b>💾 Säkerhetskopia</b><p class="small">Resultaten sparas bara i den här webbläsaren. Kopiera koden och spara den (t.ex. i Anteckningar) så kan du få tillbaka dina framsteg – även på en annan enhet.</p>' +
    '<textarea id="bk" readonly>' + backupCode() + '</textarea><button class="btn2" data-act="copybk">Kopiera koden</button>' +
    '<p class="small" style="margin-top:16px">Återställ från kod:</p><textarea id="rs" placeholder="Klistra in koden här"></textarea>' +
    '<button class="btn2" data-act="restore">Återställ</button></div>' +
    '<button class="btn2 sm" data-act="reset">Nollställ alla resultat</button>' +
    '<p class="small" style="margin-top:22px">Röst: ”Serena” från <a href="https://github.com/rhasspy/piper" style="color:inherit">Piper</a>, tränad på <a href="https://huggingface.co/datasets/committa/serena-synthetic-it-27h" style="color:inherit">serena-synthetic-it-27h</a> (CC BY 4.0).</p>';
  show(h);
}

/* ---------- Händelser ---------- */
app.addEventListener("pointerdown", function (e) {
  var t = e.target.closest && e.target.closest("[data-acc]");
  if (!t) return;
  e.preventDefault();
  var el = document.getElementById("ans");
  if (!el || el.disabled) return;
  var st = el.selectionStart == null ? el.value.length : el.selectionStart;
  var en = el.selectionEnd == null ? st : el.selectionEnd;
  el.value = el.value.slice(0, st) + t.dataset.acc + el.value.slice(en);
  el.focus();
  try { el.setSelectionRange(st + 1, st + 1); } catch (err) {}
});

app.addEventListener("click", function (e) {
  var t = e.target.closest && e.target.closest("[data-act]");
  if (!t || !app.contains(t) || t.disabled) return;
  var act = t.dataset.act, id = t.dataset.id, s = session;
  switch (act) {
    case "home": renderHome(); break;
    case "level": renderLevel(id); break;
    case "lesson": renderLesson(id); break;
    case "settings": renderSettings(); break;
    case "practice": startPractice(t.dataset.kind, id); break;
    case "test": startTest(id); break;
    case "leave": leaveSession(); break;
    case "say": speak(LESSON[view.id].items[+t.dataset.i].it[0]); break;
    case "hear": if (s) speak(s.queue[0].item.it[0]); break;
    case "hearslow": if (s) speak(s.queue[0].item.it[0], true); break;
    case "answer": onAnswer(+t.dataset.i); break;
    case "check": onCheckTyped(false); break;
    case "dunno": onCheckTyped(true); break;
    case "tile":
      if (!s.locked && !s.bank[+t.dataset.i].used) { s.bank[+t.dataset.i].used = true; s.picked.push(+t.dataset.i); drawTiles(); }
      break;
    case "untile":
      if (!s.locked) { var bi = s.picked.splice(+t.dataset.i, 1)[0]; s.bank[bi].used = false; drawTiles(); }
      break;
    case "checktiles": onCheckTiles(); break;
    case "mic": onMic(); break;
    case "giveup": grade(false, null, "Rätt: " + answerLine(s.queue[0].item)); speak(s.queue[0].item.it[0]); break;
    case "reveal": onReveal(); break;
    case "self": grade(t.dataset.ok === "1", t.dataset.ok === "1" ? "Bra! 👏" : "Öva lite till", answerLine(s.queue[0].item)); break;
    case "next": next(); break;
    case "setdevice": store.set.device = t.dataset.v === "1"; saveStore(); renderSettings(); break;
    case "setslow": store.set.slow = t.dataset.v === "1"; saveStore(); renderSettings(); break;
    case "setself": store.set.self = t.dataset.v === "1"; saveStore(); renderSettings(); break;
    case "testvoice": findVoice(); speak("Ciao! Benvenuta al corso di italiano."); break;
    case "testmic":
      var ms = document.getElementById("micst");
      ms.textContent = "Jag lyssnar …";
      listen(function (live) { ms.textContent = "”" + live + "”"; }, function (heard, err) {
        if (err === "not-allowed" || err === "service-not-allowed") ms.textContent = "⚠️ Mikrofonen är inte tillåten för den här sidan.";
        else if (!heard.length) ms.textContent = "Jag hörde inget" + (err ? " (" + err + ")" : "") + ".";
        else ms.textContent = "Jag hörde: ”" + heard[0] + "” " + (speechScore(heard, ["Buongiorno"]) >= 0.8 ? "✓ Det fungerar!" : "");
      });
      break;
    case "copybk":
      var bk = document.getElementById("bk");
      bk.value = backupCode(); bk.select();
      try { navigator.clipboard.writeText(bk.value).then(function () { t.textContent = "Kopierat ✓"; }, function () { document.execCommand("copy"); t.textContent = "Kopierat ✓"; }); }
      catch (err) { document.execCommand("copy"); t.textContent = "Kopierat ✓"; }
      break;
    case "restore":
      try {
        var data = JSON.parse(decodeURIComponent(escape(atob(document.getElementById("rs").value.trim()))));
        if (!data || typeof data !== "object" || !data.w) throw 0;
        store = fixStore(data); saveStore(); alert("Klart! Dina resultat är återställda."); renderHome();
      } catch (err) { alert("Koden fungerade inte. Kontrollera att hela koden kom med."); }
      break;
    case "reset":
      if (confirm("Vill du verkligen radera alla resultat?")) { store = fixStore({ set: store.set }); saveStore(); renderHome(); }
      break;
  }
});

document.addEventListener("keydown", function (e) {
  if (e.key !== "Enter" || !session) return;
  if (session.locked) { e.preventDefault(); next(); return; }
  if (e.target && e.target.id === "ans") { e.preventDefault(); onCheckTyped(false); }
});

renderHome();
</script>
</body>
</html>
